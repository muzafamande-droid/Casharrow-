<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050814">
<title>AVEILOT</title>
<style>
.avatar-stage{position:relative;z-index:2;height:150px;margin:18px 0 0;display:flex;align-items:center;justify-content:center;animation:fadeUp .9s .08s ease-out both}.avatar-stage:before,.avatar-stage:after{content:"";position:absolute;border:1px solid rgba(74,192,255,.3);border-radius:50%;pointer-events:none}.avatar-stage:before{width:170px;height:170px;animation:orbitSpin 8s linear infinite;box-shadow:0 0 45px rgba(0,160,255,.16)}.avatar-stage:after{width:215px;height:82px;transform:rotate(22deg);animation:orbitWide 10s linear infinite reverse}.avatar-shell{width:112px;height:112px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#75e7ff,#1668ff 48%,#744fff);box-shadow:0 0 28px rgba(30,155,255,.55),0 0 70px rgba(30,100,255,.28);animation:avatarFloat 3.6s ease-in-out infinite,avatarGlow 2.8s ease-in-out infinite alternate;overflow:hidden}.avatar-shell img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#050814}.brand{position:relative;z-index:2;margin-top:4px;font-size:clamp(54px,16vw,88px);line-height:.82;font-weight:1000;letter-spacing:-5px;background:linear-gradient(100deg,#fff 5%,#76c9ff 45%,#7b6cff 90%);-webkit-background-clip:text;background-clip:text;color:transparent}.brand i{display:block;font-size:11px;letter-spacing:7px;color:#6f9bcf;font-style:normal;margin:18px 0 0 5px}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes orbitSpin{to{transform:rotate(342deg)}}@keyframes orbitWide{to{transform:rotate(360deg)}}@keyframes avatarFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.025)}}@keyframes avatarGlow{from{box-shadow:0 0 22px rgba(30,155,255,.42),0 0 55px rgba(30,100,255,.18)}to{box-shadow:0 0 38px rgba(70,215,255,.78),0 0 90px rgba(30,100,255,.32)}}
</style>
</head>
<body>
<main class="shell container">
<section class="hero cardbox" id="guestHome">
<div class="topline"><span>FUTURE RENTAL NETWORK</span><span class="status"><span class="dot"></span>ONLINE</span></div>
<div class="avatar-stage"><div class="avatar-shell"><img id="aveilotAvatar" src="/aveilot-avatar.svg" alt="AVEILOT official avatar"></div></div>
<div class="brand">AVEILOT<i>ENERGY • MACHINES • INCOME</i></div>
<div class="tagline">Enter a smarter generation of machine rentals, wallet management and direct referral rewards.</div>
<div class="actions"><button class="primary" onclick="openModal('login')">Login</button><button class="secondary" onclick="openModal('register')">Create Account</button></div>
</section>
</main>
<script>
const avatarPath='/aveilot-avatar.svg';
document.getElementById('aveilotAvatar').src=avatarPath;
</script>
</body>
</html>
