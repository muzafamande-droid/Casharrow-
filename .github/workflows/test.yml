name: CashArrow Tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: casharrow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/casharrow_test
      ADMIN_PASSWORD: test-admin-password
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*.test.js)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No test files found"
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "=== Running ${test_file} ==="
            timeout --signal=TERM --kill-after=10s 120s node --test --test-concurrency=1 "${test_file}"
          done
