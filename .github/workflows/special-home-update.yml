name: CashArrow Special Home

on:
  push:
    branches: [codex/casharrow-special-home]

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply premium home styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          text = p.read_text()
          marker = '/* CASHARROW SPECIAL HOME V1 */'
          if marker in text:
              print('Special home styling already applied.')
              raise SystemExit(0)
          css = r'''<style>
          /* CASHARROW SPECIAL HOME V1 */
          :root{--ca-navy:#07162f;--ca-blue:#1769ff;--ca-cyan:#20c7ff;--ca-green:#12b76a;--ca-text:#172033;--ca-muted:#718096}
          body{background:linear-gradient(180deg,#f7faff 0%,#eef4ff 55%,#f8fbff 100%);color:var(--ca-text)}
          .header{position:relative;overflow:hidden;background:linear-gradient(135deg,#06142f 0%,#0a2c67 48%,#087cff 100%);padding:22px 18px 86px;border-radius:0 0 34px 34px;box-shadow:0 14px 35px rgba(7,48,112,.22)}
          .header:before,.header:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
          .header:before{width:210px;height:210px;right:-85px;top:-90px;background:rgba(32,199,255,.18)}
          .header:after{width:150px;height:150px;left:-80px;bottom:-85px;background:rgba(23,105,255,.22)}
          .top,.greeting{position:relative;z-index:1}
          .logo{font-size:27px;letter-spacing:-.5px;text-shadow:0 2px 12px rgba(0,0,0,.18)}
          .bell{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
          .greeting{margin-top:34px}
          .greeting p{font-size:13px;letter-spacing:.3px}
          .greeting h1{font-size:30px;letter-spacing:-.7px}
          .container{max-width:680px;margin:-54px auto 0;padding:0 15px}
          .balance{position:relative;border:1px solid rgba(17,76,160,.07);border-radius:24px;padding:22px;box-shadow:0 12px 32px rgba(17,45,88,.10);overflow:hidden}
          .balance:first-child{background:linear-gradient(135deg,#fff 0%,#f4f9ff 100%)}
          .balance:first-child:after{content:"";position:absolute;width:120px;height:120px;right:-45px;top:-45px;border-radius:50%;background:rgba(32,199,255,.10)}
          .balance small{font-weight:700;letter-spacing:.3px}
          .amount{font-size:38px;letter-spacing:-1px}
          .actions{gap:10px}
          button{transition:transform .15s ease,box-shadow .15s ease}
          button:active{transform:scale(.98)}
          .primary{background:linear-gradient(135deg,#0757e8,#119cff);box-shadow:0 8px 18px rgba(7,87,232,.22)}
          .secondary{background:#edf5ff;border:1px solid #dceaff}
          .section{margin-top:26px}
          .section-title h2{font-size:21px;letter-spacing:-.3px}
          .grid{gap:13px}
          .card{position:relative;border:1px solid rgba(17,76,160,.06);border-radius:20px;padding:18px;box-shadow:0 8px 22px rgba(17,45,88,.07);transition:transform .18s ease,box-shadow .18s ease}
          .card:active{transform:translateY(1px)}
          .icon{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#edf5ff,#e6f8ff);box-shadow:inset 0 0 0 1px rgba(23,105,255,.06)}
          .card h3{font-size:16px;margin-bottom:7px}
          .task{border:1px solid rgba(17,76,160,.06);border-radius:18px;padding:15px;box-shadow:0 7px 20px rgba(17,45,88,.06)}
          .task-icon{width:40px;height:40px;border-radius:12px;background:#f0f6ff;display:flex;align-items:center;justify-content:center}
          .reward{color:var(--ca-green)}
          #todayTasks .section-title{display:flex;align-items:center;justify-content:space-between}
          #todayTasks .section-title:after{content:"DAILY";font-size:10px;font-weight:800;letter-spacing:1px;color:#1769ff;background:#eaf2ff;padding:6px 8px;border-radius:999px}
          #userWallet{background:linear-gradient(135deg,#07162f 0%,#0b3d86 58%,#087cff 100%);color:white;border:0;box-shadow:0 16px 34px rgba(7,48,112,.25)}
          #userWallet small{color:rgba(255,255,255,.76)}
          #userWallet .amount{color:white}
          #userWallet .secondary{background:rgba(255,255,255,.13);color:white;border-color:rgba(255,255,255,.18)}
          #userTransactions,#rewardsSection,#teamSection,#withdrawSection{border-radius:22px}
          .bottom{height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid #e7edf6;box-shadow:0 -8px 25px rgba(17,45,88,.08)}
          .nav{min-width:62px;padding:5px 8px;border-radius:14px}
          .nav.active{background:#edf5ff}
          .nav div{font-size:21px}
          @media(max-width:420px){.header{padding-bottom:80px}.greeting h1{font-size:27px}.amount{font-size:34px}.card{padding:15px}.card p{font-size:12px}}
          </style>'''
          text = text.replace('</head>', css + '\n</head>', 1)
          p.write_text(text)
          PY

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet || git commit -m "Make CashArrow home screen premium"
          git push
